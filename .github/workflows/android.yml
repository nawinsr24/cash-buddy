name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk cash-buddy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cash-buddy-apk
          path: cash-buddy.apk
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cash-buddy.apk \
            --title "Cash Buddy (latest build)" \
            --notes "Build of ${GITHUB_SHA::7}. Debug-signed test build: allow installs from this source on your phone." \
            --prerelease
