name: Play bundle (manual)

# Builds the Google Play version (no SMS permission) as an app bundle.
# Run by hand from the Actions tab; the file is kept as a build artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Restore release signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "CB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "CB_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CB_KEY_ALIAS=$KEY_ALIAS"
              echo "CB_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "Release key not fully configured (need all four secrets): debug-signed build"
          fi
      - name: Build APK (retries on flaky downloads)
        run: |
          for attempt in 1 2 3; do
            if flutter build appbundle --release --flavor play --dart-define=STORE=play --obfuscate --split-debug-info=build/symbols; then exit 0; fi
            echo "Build attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: cash-buddy-play-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: play-debug-symbols
          path: build/symbols
          retention-days: 90
